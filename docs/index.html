
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel API Documentation</title>

  <link rel="stylesheet"
    href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
</head>
<body>
  <h1>Travel API Documentation</h1>

  <label for="api-select">Выберите API:</label>
  <select id="api-select">
    <option value="specs/openapi/PlaneTickets.yaml">
      Tickets API
    </option>
    <option value="specs/openapi/HotelBooking.yaml">
      Hotels API
    </option>
  </select>

  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    function showApi(url) {
      SwaggerUIBundle({
        url: url,
        dom_id: '#swagger-ui',
        deepLinking: true
      });
    }

    const selector = document.getElementById('api-select');

    selector.addEventListener('change', () => {
      showApi(selector.value);
    });

    showApi(selector.value);
  </script>
</body>
</html>
