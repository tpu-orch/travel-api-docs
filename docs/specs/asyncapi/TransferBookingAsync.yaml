asyncapi: 3.1.0
info:
  title: Transfer Service
  version: 1.0.0
  description: |
    Асинхронный API сервиса трансферов.
    Сервис принимает команды на бронирование и отмену трансфера,
    а также публикует результаты обработки этих команд.
servers:
  kafka:
    host: 'localhost:9092'
    protocol: kafka
    description: Потом заменим на реальный адрес
channels:
  transferBooking:
    address: transfer.booking
    messages:
      bookTransfer:
        $ref: '#/components/messages/BookTransfer'
  transferBookingCancel:
    address: transfer.booking.cancel
    messages:
      cancelTransfer:
        $ref: '#/components/messages/CancelTransfer'
  transferBookingStatus:
    address: transfer.booking-status
    messages:
      bookingStatusChanged:
        $ref: '#/components/messages/BookingStatusChanged'
  transferCancellationResult:
    address: transfer.cancellation-result
    messages:
      transferCancellationResult:
        $ref: '#/components/messages/TransferCancellationResult'
operations:
  bookTransfer:
    action: receive
    channel:
      $ref: '#/channels/transferBooking'
    messages:
      - $ref: '#/channels/transferBooking/messages/bookTransfer'
    summary: Получить команду на бронирование трансфера
    description: |
      Команда содержит compositeBookingId, назначенный оркестратором.
      Сервис самостоятельно создает внутренний bookingId.
      Стоимость рассчитывается сервисом по tariff_id и координатам маршрута.
      start_datetime сохраняется в бронировании и не влияет на цену
      в текущей версии сервиса.
  cancelTransfer:
    action: receive
    channel:
      $ref: '#/channels/transferBookingCancel'
    messages:
      - $ref: '#/channels/transferBookingCancel/messages/cancelTransfer'
    summary: Получить команду на отмену бронирования
    description: |
      Оркестратор передает compositeBookingId для связи с общей операцией
      и bookingId для идентификации бронирования внутри сервиса.
      Отправка команды сама по себе не означает, что бронирование отменено.
  bookingStatusChanged:
    action: send
    channel:
      $ref: '#/channels/transferBookingStatus'
    messages:
      - $ref: '#/channels/transferBookingStatus/messages/bookingStatusChanged'
    summary: Опубликовать результат бронирования
    description: |
      Событие содержит итоговый статус бронирования.
      При REJECTED обязательно указывается rejectionReason.
      При CONFIRMED и CANCELLED это поле не требуется.
  transferCancellationResult:
    action: send
    channel:
      $ref: '#/channels/transferCancellationResult'
    messages:
      - $ref: >-
          #/channels/transferCancellationResult/messages/transferCancellationResult
    summary: Опубликовать результат обработки отмены
    description: |
      Событие подтверждает результат обработки команды отмены.
      cancellationStatus равен CANCELLED при успешной отмене
      или REJECTED, если отменить бронирование не удалось.
      При отказе обязательно указывается rejectionReason.
components:
  messages:
    BookTransfer:
      name: BookTransfer
      title: Команда бронирования трансфера
      contentType: application/json
      payload:
        type: object
        required:
          - compositeBookingId
          - tariff_id
          - start_datetime
          - start_latitude
          - start_longitude
          - end_latitude
          - end_longitude
        properties:
          compositeBookingId:
            type: integer
            format: int64
            description: 'Идентификатор общей операции, назначенный оркестратором'
          tariff_id:
            type: integer
            format: int64
            description: Идентификатор тарифа из Tariff.ID
          start_datetime:
            type: string
            format: date-time
          start_latitude:
            type: number
            format: double
          start_longitude:
            type: number
            format: double
          end_latitude:
            type: number
            format: double
          end_longitude:
            type: number
            format: double
    CancelTransfer:
      name: CancelTransfer
      title: Команда отмены трансфера
      contentType: application/json
      payload:
        type: object
        required:
          - compositeBookingId
          - bookingId
        properties:
          compositeBookingId:
            type: integer
            format: int64
            description: 'Идентификатор общей операции, назначенный оркестратором'
          bookingId:
            type: integer
            format: int64
            description: Внутренний идентификатор бронирования в сервисе трансферов
    BookingStatusChanged:
      name: BookingStatusChanged
      title: Событие изменения статуса бронирования
      contentType: application/json
      payload:
        type: object
        required:
          - compositeBookingId
          - bookingId
          - tariff_id
          - start_datetime
          - calculated_price
          - bookingStatus
        properties:
          compositeBookingId:
            type: integer
            format: int64
            description: 'Идентификатор общей операции, возвращается без изменений'
          bookingId:
            type: integer
            format: int64
            description: Внутренний идентификатор бронирования
          tariff_id:
            type: integer
            format: int64
          start_datetime:
            type: string
            format: date-time
          calculated_price:
            type: number
            format: double
            minimum: 0
            description: Итоговая стоимость трансфера
          bookingStatus:
            type: string
            enum:
              - PENDING
              - CONFIRMED
              - REJECTED
              - CANCELLED
          rejectionReason:
            type: string
            description: |
              Причина отказа. Обязательна при bookingStatus = REJECTED.
              Для CONFIRMED и CANCELLED не требуется.
          created_at:
            type: string
            format: date-time
    TransferCancellationResult:
      name: TransferCancellationResult
      title: Результат отмены бронирования
      contentType: application/json
      payload:
        type: object
        required:
          - compositeBookingId
          - bookingId
          - cancellationStatus
        properties:
          compositeBookingId:
            type: integer
            format: int64
            description: 'Идентификатор общей операции, возвращается без изменений'
          bookingId:
            type: integer
            format: int64
            description: Внутренний идентификатор бронирования
          cancellationStatus:
            type: string
            enum:
              - CANCELLED
              - REJECTED
            description: Результат обработки команды отмены
          rejectionReason:
            type: string
            description: Обязательна при cancellationStatus = REJECTED