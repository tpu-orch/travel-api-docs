            example: 12431243
          ticketId:
            type: integer
            format: int64
            description: |
              Идентификатор авиабилета.
            example: 12345
          status:
            type: string
            description: |
              Новый статус бронирования авиабилета.
            enum:
            - AVAILABLE
            - RESERVATION_PENDING
            - RESERVED
            - CANCELLATION_PENDING
            - CANCELLED
            example: RESERVED
  schemas:
    TicketCommand:
      type: object
      description: |
        Команда на выполнение операции с бронированием
        авиабилета.
      required:
      - compositeBookingId
      - ticketId
      properties:
        compositeBookingId:
          type: integer
          format: int64
          description: |
            Уникальный идентификатор составного бронирования,
            созданный оркестратором путешествий.
          example: 123312
        ticketId:
          type: integer
          format: int64
          description: |
            Уникальный идентификатор авиабилета,
            над которым выполняется операция.
          example: 12345
    ReservationStatusChangedPayload:
      type: object
      description: |
        Событие с результатом обработки операции
        бронирования авиабилета.

        compositeBookingId соответствует идентификатору,
        переданному в исходной команде.
      required:
      - compositeBookingId
      - ticketId
      - status
      properties:
        compositeBookingId:
          type: integer
          format: int64
          description: |
            Идентификатор составного бронирования,
            к которому относится событие.
          example: 12431243
        ticketId:
          type: integer
          format: int64
          description: |
            Идентификатор авиабилета.
          example: 12345
        status:
          type: string
          description: |
            Новый статус бронирования авиабилета.
          enum:
          - AVAILABLE
          - RESERVATION_PENDING
          - RESERVED
