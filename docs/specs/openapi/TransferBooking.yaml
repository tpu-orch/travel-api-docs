
openapi: 3.0.3
info:
  title: Transfer Service
  version: 1.0.0
  description: |
    Сервис расчета стоимости и бронирования трансферов.
    Стоимость рассчитывается на основе координат начала и конца маршрута,
    времени начала поездки и выбранного тарифа.

servers:
  - url: http://localhost:8080
    description: Потом заменить на реальный адрес

tags:
  - name: Transfers
    description: Расчет стоимости трансфера
  - name: Bookings
    description: Получение информации о бронировании

paths:
  /transfers/quote:
    post:
      tags:
        - Transfers
      summary: Рассчитать стоимость трансфера
      description: |
        Рассчитывает доступные тарифы и итоговую стоимость маршрута.

        Маршрут может проходить через несколько областей.
        Для каждого участка маршрута применяется цена за километр
        выбранного тарифа в области, покрывающей этот участок.
        Если участок покрывается несколькими областями, применяется
        максимальная цена за километр среди них.

        Тариф доступен для маршрута, только если цена этого тарифа
        определена для всех участков маршрута.

        Поле start_datetime передается для планирования поездки.
        В текущей версии оно не влияет на стоимость.
      operationId: calculateTransferQuote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferQuoteRequest'
            example:
              start_datetime: "2026-11-01T14:30:00Z"
              start_latitude: 56.4846
              start_longitude: 84.9476
              end_latitude: 55.7558
              end_longitude: 37.6173
      responses:
        '200':
          description: Стоимость рассчитана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferQuoteResponse'
              example:
                start_datetime: "2026-11-01T14:30:00Z"
                distance_km: 2800.5
                tariffs:
                  - tariff_id: 1
                    tariff_name: Premium
                    calculated_price: 150000
                    currency: RUB
                  - tariff_id: 2
                    tariff_name: VIP
                    calculated_price: 210000
                    currency: RUB
        '400':
          description: Некорректные координаты или дата начала поездки
        '500':
          description: Внутренняя ошибка сервиса

  /transfers/bookings/{bookingId}:
    get:
      tags:
        - Bookings
      summary: Получить статус бронирования
      description: Возвращает информацию о бронировании по внутреннему идентификатору сервиса.
      operationId: getTransferBooking
      parameters:
        - name: bookingId
          in: path
          required: true
          description: Внутренний идентификатор бронирования в сервисе трансферов
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Бронирование найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferBooking'
              example:
                booking_id: 42
                tariff_id: 1
                tariff_name: Premium
                start_datetime: "2026-11-01T14:30:00Z"
                start_latitude: 56.4846
                start_longitude: 84.9476
                end_latitude: 55.7558
                end_longitude: 37.6173
                calculated_price: 150000
                currency: RUB
                booking_status: CONFIRMED
                created_at: "2026-10-29T12:00:00Z"
        '404':
          description: Бронирование не найдено
        '500':
          description: Внутренняя ошибка сервиса

components:
  schemas:
    TransferQuoteRequest:
      type: object
      required:
        - start_datetime
        - start_latitude
        - start_longitude
        - end_latitude
        - end_longitude
      properties:
        start_datetime:
          type: string
          format: date-time
          description: Планируемое время начала поездки
        start_latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        start_longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        end_latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        end_longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180

    TransferQuoteResponse:
      type: object
      required:
        - start_datetime
        - distance_km
        - tariffs
      properties:
        start_datetime:
          type: string
          format: date-time
        distance_km:
          type: number
          format: double
          description: Приблизительное расстояние по прямой
        tariffs:
          type: array
          description: Тарифы, доступные для всего маршрута
          items:
            $ref: '#/components/schemas/TariffQuote'

    TariffQuote:
      type: object
      required:
        - tariff_id
        - tariff_name
        - calculated_price
        - currency
      properties:
        tariff_id:
          type: integer
          format: int64
        tariff_name:
          type: string
        calculated_price:
          type: number
          format: double
          minimum: 0
          description: Итоговая стоимость маршрута, не цена за километр
        currency:
          type: string
          example: RUB

    TransferBooking:
      type: object
      required:
        - booking_id
        - tariff_id
        - tariff_name
        - start_datetime
        - start_latitude
        - start_longitude
        - end_latitude
        - end_longitude
        - calculated_price
        - currency
        - booking_status
        - created_at
      properties:
        booking_id:
          type: integer
          format: int64
          description: Внутренний идентификатор бронирования
        tariff_id:
          type: integer
          format: int64
          description: Внешний ключ на Tariff.ID
        tariff_name:
          type: string
          description: Название тарифа на момент ответа
        start_datetime:
          type: string
          format: date-time
        start_latitude:
          type: number
          format: double
        start_longitude:
          type: number
          format: double
        end_latitude:
          type: number
          format: double
        end_longitude:
          type: number
          format: double
        calculated_price:
          type: number
          format: double
          minimum: 0
        currency:
          type: string
          example: RUB
        booking_status:
          $ref: '#/components/schemas/BookingStatus'
        created_at:
          type: string
          format: date-time

    BookingStatus:
      type: string
      enum:
        - PENDING
        - CONFIRMED
        - REJECTED
        - CANCELLED
